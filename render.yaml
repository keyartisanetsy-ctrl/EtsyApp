services:
  - type: web
    name: etsy-command-center
    runtime: node
    plan: starter
    region: frankfurt
    branch: claude/etsy-bulk-management-app-q3enu5
    buildCommand: npm install --include=dev && npm run codegen && npm run build
    startCommand: npm start
    healthCheckPath: /etsy-shopify/api/health
    autoDeploy: true
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: OPEN_BROWSER
        value: "0"
      - key: DATA_DIR
        value: /var/data
      # Render already redeploys on every push; the VDS-oriented self-update
      # (checks GitHub, npm install/build, restart) would just fight that.
      - key: AUTO_UPDATE
        value: "0"
      # Served behind a Cloudflare Worker at keyartisan.us/etsy-shopify,
      # alongside the sibling Product Studio app at /product-studio.
      - key: BASE_PATH
        value: /etsy-shopify
      - key: PUBLIC_HOST
        value: keyartisan.us
